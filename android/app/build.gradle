plugins { id 'com.android.application' }

android {
    namespace 'com.jskimlam.picklemarinetracking'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jskimlam.picklemarinetracking'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
