<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>피클마린트래킹 (Pickle Marine Tracking)</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    :root {
      --bg-page: #0b0e14;
      --bg-card: #141824;
      --bg-card-glass: rgba(20, 24, 36, 0.88);
      --border-line: #222b40;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --text-mute: #64748b;
      --accent-cyan: #06b6d4;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --radius-card: 16px;
      --radius-pill: 999px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* 상단 플로팅 검색 & 헤더 바 */
    .top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .header-box {
      background: var(--bg-card-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-line);
      border-radius: var(--radius-card);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon { font-size: 20px; }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .live-chip {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: var(--accent-green);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
      100% { transform: scale(0.8); opacity: 1; }
    }

    /* 검색창 & 선박 선택 칩 */
    .search-row {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .search-input-box {
      flex: 1;
      background: var(--bg-card-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-line);
      border-radius: var(--radius-pill);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .search-input-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .search-input-box input::placeholder { color: var(--text-mute); }

    /* 선박 빠른 전환 칩 목록 */
    .fleet-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      pointer-events: auto;
      scrollbar-width: none;
    }
    .fleet-chips::-webkit-scrollbar { display: none; }
    .chip {
      background: rgba(20, 24, 36, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-line);
      border-radius: var(--radius-pill);
      padding: 5px 12px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-sub);
      white-space: nowrap;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .chip.active {
      background: rgba(6, 182, 212, 0.18);
      border-color: var(--accent-cyan);
      color: #fff;
    }

    /* Leaflet 지도 컨테이너 */
    #map {
      width: 100%;
      height: 100%;
      background: #080c14;
    }

    /* 하단 플로팅 관제 카드 (HUD Drawer) */
    .bottom-hud {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      background: var(--bg-card-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-line);
      border-radius: var(--radius-card);
      padding: 14px 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 600px;
      margin: 0 auto;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .vessel-main-info h2 {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .vessel-main-info span {
      font-size: 11.5px;
      color: var(--accent-blue);
      font-family: monospace;
    }
    .hud-eta-badge {
      text-align: right;
    }
    .hud-eta-badge .eta-title {
      font-size: 10px;
      color: var(--text-mute);
      text-transform: uppercase;
      font-weight: 700;
    }
    .hud-eta-badge .eta-val {
      font-size: 14px;
      font-weight: 800;
      color: var(--accent-amber);
    }

    /* 항해 게이지 */
    .hud-route-progress {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .route-ports-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
    }
    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: #1e293b;
      border-radius: var(--radius-pill);
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-amber));
      width: 64%;
      transition: width 0.4s ease;
    }

    /* 4대 주요 지표 칩 */
    .hud-metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .hud-metric-card {
      background: rgba(28, 34, 51, 0.6);
      border: 1px solid var(--border-line);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .hud-metric-card .lbl { font-size: 10px; color: var(--text-mute); }
    .hud-metric-card .val { font-size: 12.5px; font-weight: 700; color: #fff; }

    /* 버튼 액션 바 */
    .hud-btn-row {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }
    .hud-btn {
      flex: 1;
      padding: 9px;
      border-radius: var(--radius-pill);
      font-size: 11.5px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      border: none;
      cursor: pointer;
    }
    .hud-btn.primary {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #fff;
    }
    .hud-btn.secondary {
      background: var(--bg-card);
      border: 1px solid var(--border-line);
      color: var(--text-main);
    }

    /* 커스텀 마커 레이더 스타일 */
    .radar-marker {
      position: relative;
      width: 24px;
      height: 24px;
    }
    .radar-marker-dot {
      width: 12px;
      height: 12px;
      background: #06b6d4;
      border: 2px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 6px;
      left: 6px;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.9);
    }
    .radar-marker-wave {
      position: absolute;
      top: 0;
      left: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid #06b6d4;
      animation: wave 2s infinite;
    }
    @keyframes wave {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="app">

    <!-- 상단 헤더 & 검색 바 -->
    <div class="top-bar">
      <div class="header-box">
        <div class="brand">
          <span class="brand-icon">🚢</span>
          <div class="brand-title">
            피클마린트래킹
            <span class="live-chip"><span class="live-dot"></span>AIS LIVE</span>
          </div>
        </div>
        <button id="btnZoomFit" style="background:transparent; border:none; color:var(--accent-blue); font-size:11px; font-weight:700; cursor:pointer;">
          📐 6x 광역뷰 리셋
        </button>
      </div>

      <!-- 검색창 -->
      <div class="search-row">
        <div class="search-input-box">
          <span>🔍</span>
          <input type="text" id="shipSearchInput" placeholder="선박명 또는 IMO 번호 검색 (예: SUNRISE SAMBU)" />
        </div>
      </div>

      <!-- 빠른 전환 칩 -->
      <div class="fleet-chips" id="fleetChipsContainer">
        <!-- 동적 렌더링 -->
      </div>
    </div>

    <!-- 리플릿 지도 -->
    <div id="map"></div>

    <!-- 하단 관제 카드 (HUD) -->
    <div class="bottom-hud" id="bottomHud">
      <div class="hud-header">
        <div class="vessel-main-info">
          <h2 id="hudVesselName">SUNRISE SAMBU</h2>
          <span id="hudVesselSub">IMO 9288007 · 화물: 스타이렌모노머(SM)</span>
        </div>
        <div class="hud-eta-badge">
          <div class="eta-title">입항 예정 (ETA)</div>
          <div class="eta-val" id="hudEta">오늘 20:00 KST</div>
        </div>
      </div>

      <!-- 항해 진행 바 -->
      <div class="hud-route-progress">
        <div class="route-ports-row">
          <span id="hudOrigin">대만 안핑항 (11/07 출항)</span>
          <span id="hudDest">여수 중흥부두 (진행률 64%)</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="hudProgressFill"></div>
        </div>
      </div>

      <!-- 4대 핵심 지표 -->
      <div class="hud-metrics-row">
        <div class="hud-metric-card">
          <span class="lbl">현재 속력</span>
          <span class="val" id="hudSpeed">6.2 kn</span>
        </div>
        <div class="hud-metric-card">
          <span class="lbl">침로</span>
          <span class="val" id="hudCourse">004° NNE</span>
        </div>
        <div class="hud-metric-card">
          <span class="lbl">현재 흘수</span>
          <span class="val" id="hudDraught" style="color:var(--accent-amber);">6.4 m</span>
        </div>
        <div class="hud-metric-card">
          <span class="lbl">잔여 거리</span>
          <span class="val" id="hudDistance">~315 nm</span>
        </div>
      </div>

      <!-- 원터치 외부 링크 버튼 -->
      <div class="hud-btn-row">
        <a id="btnGoogleMaps" href="https://www.google.com/maps?q=29.3373,123.2278&z=6" target="_blank" class="hud-btn primary">
          <span>📍</span> 구글 지도 6x 조망
        </a>
        <a id="btnVesselFinder" href="https://www.vesselfinder.com/vessels/details/9288007" target="_blank" class="hud-btn secondary">
          <span>🌐</span> VesselFinder 항적
        </a>
      </div>
    </div>

  </div>

  <script>
    // 선박 데이터셋
    const fleetData = [
      {
        id: "sunrise-sambu",
        name: "SUNRISE SAMBU",
        imo: "9288007",
        mmsi: "440213000",
        cargo: "스타이렌모노머(SM) 만재",
        origin: "대만 안핑항 (An Ping)",
        originAtd: "11/07 10:26 KST",
        destination: "여수 중흥부두",
        destinationSub: "제2중흥부두 석화 선석",
        lat: 29.3373,
        lon: 123.2278,
        speed: 6.2,
        course: "004° NNE",
        draught: "6.4 m",
        eta: "오늘 20:00 KST",
        progress: 64,
        distanceNm: 315,
        status: "항해 중 (Underway)",
        routeHistory: [
          [22.99, 120.15], // Anping
          [24.50, 120.30],
          [26.20, 121.50],
          [28.00, 122.80],
          [29.3373, 123.2278] // Current
        ],
        routeFuture: [
          [29.3373, 123.2278],
          [31.50, 124.50],
          [33.30, 126.50], // Jeju South
          [34.76, 127.75]  // Yeosu
        ]
      },
      {
        id: "grace-sambu",
        name: "GRACE SAMBU",
        imo: "9288019",
        mmsi: "440213001",
        cargo: "원료 케미칼 / 모노머",
        origin: "울산 석화부두",
        originAtd: "11/05 14:00 KST",
        destination: "여수 석화부두",
        destinationSub: "낙포부두 하역 완료",
        lat: 34.8210,
        lon: 127.7540,
        speed: 0.0,
        course: "정박 중 (Moored)",
        draught: "5.1 m",
        eta: "접안 완료",
        progress: 100,
        distanceNm: 0,
        status: "접안 완료",
        routeHistory: [
          [35.48, 129.38],
          [34.8210, 127.7540]
        ],
        routeFuture: []
      }
    ];

    let activeVessel = fleetData[0];

    // 1. 지도 초기화 (진수 님이 요청하신 딱 그 조망 거리: Zoom 6x)
    const map = L.map('map', {
      center: [29.5, 124.2],
      zoom: 6,
      zoomControl: false,
      attributionControl: false
    });

    // CartoDB Dark Matter 타일 (고급스러운 매트 블랙 해상 뷰)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // 우측 상단 줌 컨트롤
    L.control.zoom({ position: 'topright' }).addTo(map);

    // 레이어 관리 객체
    let markersLayer = L.layerGroup().addTo(map);
    let routeLayer = L.layerGroup().addTo(map);

    // 커스텀 레이더 마커 생성 함수
    function createRadarIcon() {
      return L.divIcon({
        className: 'radar-marker-container',
        html: `
          <div class="radar-marker">
            <div class="radar-marker-wave"></div>
            <div class="radar-marker-dot"></div>
          </div>
        `,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });
    }

    function renderVesselOnMap(v) {
      markersLayer.clearLayers();
      routeLayer.clearLayers();

      // 1. 항적선 그리기
      if (v.routeHistory && v.routeHistory.length > 0) {
        L.polyline(v.routeHistory, {
          color: '#06b6d4',
          weight: 4,
          opacity: 0.85
        }).addTo(routeLayer);
      }
      if (v.routeFuture && v.routeFuture.length > 0) {
        L.polyline(v.routeFuture, {
          color: '#f59e0b',
          weight: 3,
          opacity: 0.9,
          dashArray: '6, 6'
        }).addTo(routeLayer);
      }

      // 2. 출항지 & 목적지 핀
      if (v.routeHistory.length > 0) {
        const originCoord = v.routeHistory[0];
        L.circleMarker(originCoord, {
          radius: 6,
          fillColor: '#06b6d4',
          color: '#fff',
          weight: 2,
          fillOpacity: 1
        }).bindPopup(`<b>${v.origin}</b><br>출항: ${v.originAtd}`).addTo(markersLayer);
      }

      if (v.routeFuture.length > 0) {
        const destCoord = v.routeFuture[v.routeFuture.length - 1];
        L.circleMarker(destCoord, {
          radius: 7,
          fillColor: '#f59e0b',
          color: '#fff',
          weight: 2,
          fillOpacity: 1
        }).bindPopup(`<b>${v.destination}</b><br>ETA: ${v.eta}`).addTo(markersLayer);
      }

      // 3. 선박 실시간 마커
      const shipMarker = L.marker([v.lat, v.lon], { icon: createRadarIcon() }).addTo(markersLayer);
      shipMarker.bindPopup(`
        <div style="color:#0f172a; font-family:sans-serif;">
          <h4 style="margin:0 0 4px;">${v.name}</h4>
          <p style="margin:0; font-size:12px;"><b>화물:</b> ${v.cargo}</p>
          <p style="margin:0; font-size:12px;"><b>속력:</b> ${v.speed} kn (${v.course})</p>
          <p style="margin:0; font-size:12px;"><b>흘수:</b> ${v.draught}</p>
          <p style="margin:0; font-size:12px;"><b>목적지:</b> ${v.destination} (ETA ${v.eta})</p>
        </div>
      `).openPopup();
    }

    function updateHud(v) {
      document.getElementById('hudVesselName').textContent = v.name;
      document.getElementById('hudVesselSub').textContent = `IMO ${v.imo} · 화물: ${v.cargo}`;
      document.getElementById('hudEta').textContent = v.eta;
      document.getElementById('hudOrigin').textContent = `${v.origin.split(" ")[0]} 출항`;
      document.getElementById('hudDest').textContent = `${v.destination} (진행 ${v.progress}%)`;
      document.getElementById('hudProgressFill').style.width = `${v.progress}%`;
      document.getElementById('hudSpeed').textContent = `${v.speed} kn`;
      document.getElementById('hudCourse').textContent = v.course;
      document.getElementById('hudDraught').textContent = v.draught;
      document.getElementById('hudDistance').textContent = v.distanceNm > 0 ? `~${v.distanceNm} nm` : '도착 완료';

      // 외부 링크 업데이트 (Zoom 6x 파라미터 적용)
      document.getElementById('btnGoogleMaps').href = `https://www.google.com/maps?q=${v.lat},${v.lon}&z=6`;
      document.getElementById('btnVesselFinder').href = `https://www.vesselfinder.com/vessels/details/${v.imo}`;
    }

    function renderFleetChips() {
      const container = document.getElementById('fleetChipsContainer');
      container.innerHTML = '';

      fleetData.forEach(v => {
        const chip = document.createElement('div');
        chip.className = `chip ${v.id === activeVessel.id ? 'active' : ''}`;
        chip.innerHTML = `🚢 ${v.name} (${v.progress}%)`;
        chip.addEventListener('click', () => {
          activeVessel = v;
          renderFleetChips();
          updateHud(v);
          renderVesselOnMap(v);
          map.panTo([v.lat, v.lon]);
        });
        container.appendChild(chip);
      });
    }

    // 6x 광역뷰 리셋 버튼
    document.getElementById('btnZoomFit').addEventListener('click', () => {
      map.setView([29.5, 124.2], 6);
    });

    // 검색 기능
    document.getElementById('shipSearchInput').addEventListener('input', (e) => {
      const q = e.target.value.trim().toUpperCase();
      if (!q) return;
      const found = fleetData.find(v => v.name.includes(q) || v.imo.includes(q));
      if (found) {
        activeVessel = found;
        renderFleetChips();
        updateHud(found);
        renderVesselOnMap(found);
        map.panTo([found.lat, found.lon]);
      }
    });

    // PWA 서비스 워커 등록
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
    }

    // 초기 실행
    renderFleetChips();
    updateHud(activeVessel);
    renderVesselOnMap(activeVessel);
  </script>
</body>
</html>
