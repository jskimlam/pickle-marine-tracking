<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="lilacGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#a855f7" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Body: Korean Consonant ㅇ (Circle) -->
  <circle cx="60" cy="60" r="46" fill="url(#lilacGrad)" filter="url(#softGlow)"/>
  <circle cx="60" cy="60" r="28" fill="#0b0e14"/>
  <!-- Eyes -->
  <g class="eyes">
    <ellipse cx="48" cy="38" rx="4" ry="5.5" fill="#ffffff"/>
    <circle cx="49" cy="36" r="1.8" fill="#1e1b4b"/>
    <ellipse cx="72" cy="38" rx="4" ry="5.5" fill="#ffffff"/>
    <circle cx="73" cy="36" r="1.8" fill="#1e1b4b"/>
  </g>
  <!-- Cheeks -->
  <ellipse cx="40" cy="45" rx="4.5" ry="2.5" fill="#f472b6" opacity="0.65"/>
  <ellipse cx="80" cy="45" rx="4.5" ry="2.5" fill="#f472b6" opacity="0.65"/>
  <!-- Cute Smile -->
  <path d="M 55 45 Q 60 49 65 45" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>